name: Reset demo

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    # Skipped until the demo is deployed and DEMO_URL is set as a repository variable.
    if: vars.DEMO_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reset demo data
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
          DEMO_RESET_SECRET: ${{ secrets.DEMO_RESET_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 60 \
            --request POST \
            --header "Authorization: Bearer ${DEMO_RESET_SECRET}" \
            "${DEMO_URL%/}/api/demo/reset"
